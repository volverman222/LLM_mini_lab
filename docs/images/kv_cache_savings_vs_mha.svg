<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">GQA KV-cache savings relative to MHA</title>
  <desc id="desc">A line chart showing KV-cache savings falling from 95.8 percent for one key-value group to zero for 24 groups, the MHA baseline.</desc>
  <rect width="900" height="520" fill="white"/>
  <text x="450" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold">GQA KV-cache savings relative to MHA</text>
  <text x="450" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#444">24 heads · 48 layers · context 8,192 · batch 1 · bf16</text>
  <g stroke="#d7d7d7" stroke-width="1">
    <line x1="90" y1="90" x2="840" y2="90"/><line x1="90" y1="167.5" x2="840" y2="167.5"/><line x1="90" y1="245" x2="840" y2="245"/><line x1="90" y1="322.5" x2="840" y2="322.5"/><line x1="90" y1="400" x2="840" y2="400"/>
  </g>
  <g stroke="#222" stroke-width="1.5"><line x1="90" y1="90" x2="90" y2="400"/><line x1="90" y1="400" x2="840" y2="400"/></g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="end"><text x="80" y="94">100%</text><text x="80" y="171.5">75%</text><text x="80" y="249">50%</text><text x="80" y="326.5">25%</text><text x="80" y="404">0%</text></g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle"><text x="120" y="423">1</text><text x="220" y="423">2</text><text x="320" y="423">3</text><text x="420" y="423">4</text><text x="520" y="423">6</text><text x="620" y="423">8</text><text x="720" y="423">12</text><text x="820" y="423">24</text></g>
  <text x="465" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Number of KV groups (G)</text>
  <text x="24" y="245" text-anchor="middle" transform="rotate(-90 24 245)" font-family="Arial, sans-serif" font-size="14">KV-cache saving vs MHA</text>
  <polyline points="120,103 220,116 320,129 420,142 520,167.5 620,193.3 720,245 820,400" fill="none" stroke="#1769aa" stroke-width="3"/>
  <g fill="#1769aa" stroke="white" stroke-width="2"><circle cx="120" cy="103" r="5"/><circle cx="220" cy="116" r="5"/><circle cx="320" cy="129" r="5"/><circle cx="420" cy="142" r="5"/><circle cx="520" cy="167.5" r="5"/><circle cx="620" cy="193.3" r="5"/><circle cx="720" cy="245" r="5"/><circle cx="820" cy="400" r="5"/></g>
  <g font-family="Arial, sans-serif" font-size="13"><text x="113" y="84" fill="#1769aa">MQA: 95.8%</text><text x="735" y="382" fill="#1769aa">MHA: 0%</text></g>
</svg>
